pull-settings=Pull settings
mode-all=Pull all items
mode-whitelist=Only selected items
mode-blacklist=All except selected items
one-per-surface=Only one factory outlet per surface
legacy-slot=This slot was picked before filters had a quality, so it matches EVERY quality — whatever the icon shows. Pick it again to pin it to one quality.
match-quality=Match quality on filters
match-quality-tooltip=Off: a filter slot covers its item at every quality. On: a slot only matches the quality it was picked at, so you can pull (or block) legendary iron plates without touching normal ones. Slots picked before this setting existed carry no quality and keep matching all of them until you re-pick them.
circuit-filters=Set filters from circuit network
circuit-filters-tooltip=The connected red/green signals become the filter list, and the slots above are ignored (they grey out). Every item signal with a positive count is one entry; the dropdown still decides whether that list is a whitelist or a blacklist. No item signals means an empty list — under "Only selected items" the outlet pulls nothing, which is what the circuit gate does anyway when every signal is zero. With "Match quality on filters" on, each signal's own quality is binding.
loop-guards=Loop guards
loop-guards-tooltip=Stop items going round in circles. An inlet asks the network for what the factories are missing, the outlet pulls that same thing back out of those factories, and round it goes — nothing gained, robots busy forever. Each option below breaks the circle somewhere different. All off unless you turn them on.
guard-inlet=Don't count inlet requests as demand
guard-inlet-tooltip=The outlet ignores anything a factory inlet is asking for on its own. Requests you set on an inlet by hand still count. This is the blunt fix — the circle never starts.
guard-items=Don't pull anything an inlet wants
guard-items-tooltip=While an inlet on this surface is asking for an item, the outlet leaves that item alone — even if something outside genuinely wants it. Everything else still moves normally.
guard-cooldown=Wait 10 s before taking an item back
guard-cooldown-tooltip=After the outlet puts an item back into the factories, it won't take that item again for 10 seconds. Use this if you see the same stack bouncing in and out every couple of seconds.
guard-fluid=Pause while an inlet holds this fluid
guard-fluid-tooltip=Stops fluid going round in a circle. Put a fluid outlet and a fluid inlet on the same pipe and the outlet empties your factory tanks while the inlet pushes it all back in. With this on, the outlet waits while any fluid inlet on this surface is holding the fluid it's set to pull. Changing which fluid it pulls still works normally.
fluid-paused-loop=[color=yellow](paused — a fluid inlet on this surface is holding this fluid)[/color]
guard-storage=Leave items in storage for 60 s
guard-storage-tooltip=Only does anything with "Also pull from storage chests" ticked. Once the outlet has put an item into a storage chest inside a factory, it leaves it there for 60 seconds instead of grabbing it straight back out. Provider chests are unaffected.
storage=Also pull from storage chests
storage-tooltip=Additionally empty the yellow storage chests inside the factories (deconstruction leftovers and the like), not just provider chests.
item-hint=\nLeft-click: show on map. Shift-click: take a stack. Ctrl-click: take all you can carry. Alt-click: add to your own logistic requests. Right-click: pin to top.
requested=Requesting __1__ __2__ — your robots will bring it
