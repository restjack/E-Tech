sensor-storage-tooltip=Include the yellow storage chests inside the factories in the broadcast totals, not just provider chests.
sensor-deficits=Subtract what the factories are short of
sensor-deficits-tooltip=Also read the requester and buffer chests inside the factories and subtract their unmet requests from the totals. A signal then reads positive when the factories have that item spare and negative when they are short by that much, so one wire carries both. Doubles the sensor's chest walk, so leave it off if you only want stock.
