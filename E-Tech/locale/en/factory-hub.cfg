factory-filter-tooltip=Show only what one factory holds. The number on each item then counts that factory alone, not the whole surface.
sort-tooltip=How the item grid is ordered. Pinned items stay on top whichever you pick.
sort-count=Most first
sort-name=By name
sort-rate=Moving most
factories=Factories (click Map, or type to name)
locate=Map
inlet-title=Factory inlet
inlet-rate=Delivered last minute: __1__ items
reset-spoilage=Reset spoilage on delivery (old behaviour)
reset-spoilage-tooltip=Off (default): distributed items keep their spoilage, along with durability and ammo, because the actual stacks are moved. On: items are re-created on arrival with a full spoilage timer, which is how the inlet worked before 0.24.0 — handy if you deliberately want an inlet to refresh perishables, and a free lunch on Gleba if you don't.
auto-request=Auto-request what the factories need
auto-request-tooltip=Reads the unmet requests of the requester/buffer chests inside the factories and sets them as this inlet's own bot requests (the managed "etech-inlet-auto" group in its logistics tab). Outside bots then deliver exactly what's needed and the inlet forwards it inside.

