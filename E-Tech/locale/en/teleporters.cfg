etech-personal-teleporter=Pays up to half of each teleport's energy cost from its own 50 MJ buffer, charged by your armor's generators. The destination pad covers the rest.

[tips-and-tricks-item-name]
etech-teleporters=Teleporter pads

[tips-and-tricks-item-description]
etech-teleporters=Walk onto a [entity=etech-teleporter] teleporter pad and the destination list opens. Most of what the list can do is keyboard and mouse work that nothing on screen advertises:\n - Right-click a pad to star it. Starred pads always sort first.\n - Shift + right-click renames a pad. The name shows on the map and in blueprints.\n - The sort dropdown switches between recently used, A–Z and nearest first, and the tick box next to it hides everything except your starred and recent pads.\n - CONTROL + F focuses the search box; ENTER teleports to the first pad still showing.\n - SHIFT + T opens the list from anywhere once Teleporters is researched (the wireless remote), and SHIFT + R jumps straight back to the pad you used last, no window at all.\n - After a remote jump the list offers a free Return entry, and after you die, a free jump back to your body.\n - Teleporting drains the DESTINATION pad's buffer, so an unpowered pad can't be jumped to. Higher-quality pads hold more energy and cost less to use.
