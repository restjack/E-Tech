[mod-setting-description]
etech-pickup-crashed-ship=Makes crash-site spaceship parts minable and gives placement items so you can pick them up and put them back down. Unrelated to the AAI recipe restore, hence its own switch. On by default.
etech-beacon-all-modules=Lets every beacon accept every module type, including productivity and quality modules. Applies to modded beacons too. On by default.
etech-quality-asteroid=Enables quality on all asteroid crushing and reprocessing recipes so quality modules in the crusher take effect. On by default.
etech-quality-module-slots=Every machine that has at least one module slot gains extra slots at higher quality - assemblers, furnaces, rocket silos, beacons, mining drills, and labs (modded ones included). Machines with no module slots are untouched. Replaces the retired QualityEffectsFixed mod with a blanket rule. Needs the Quality mod; on by default.
etech-nuclear-fuel-stack=Stack size for nuclear fuel. Vanilla is 1.
etech-artillery-shell-stack=Stack size for artillery shells. Vanilla is 1.
etech-ag-science-spoils=When on (default, vanilla), agricultural science packs spoil normally. Turn off to stop them spoiling.
etech-restore-nuclear-fuel=Krastorio 2 hides vanilla nuclear fuel (the rocket-fuel + U-235 train fuel). Turn on to bring the item and recipe back, unlocked by Kovarex enrichment like vanilla. Off by default because hiding it is a deliberate K2 balance choice.
etech-restore-engine-cosmetics=Restores the vanilla names and icons of engine units and electric engine units that AAI Industry renames ("Multi-cylinder engine" etc.). Turn off if another mod should own their look. On by default.
etech-debug-log=Writes one log line per recipe the restore engine touches or skips to factorio-current.log. Off by default - only the summary line is logged. Turn on when diagnosing why a recipe did or didn't revert.
etech-gleba-uranium=Adds uranium bacteria, mirroring iron/copper bacteria: jelly gives a 1% chance of uranium bacteria (Jellynut tech), bacteria + bioflux multiplies it in a biochamber (Bacteria cultivation tech), and it spoils into uranium ore. Port of the abandoned Simple Gleba Uranium mod by cindersash. Needs Space Age; on by default.
etech-void=Adds a cheap void chest (destroys any item put in it) and void pipe (destroys any fluid pumped in), unlocked by a small early technology. Port of the abandoned Easy Void mod; automatically skipped if the original mod is installed. Existing placed voids from the original survive the switch. On by default.
etech-void-tint=Colour of the void chest and void pipe, as a 6-digit hex code — the same form a colour picker or a web page gives you. "BF00FF" or "#BF00FF" both work. The filtered void chest uses a greener shade of whatever you pick, so the two stay easy to tell apart. Default BF00FF (purple). Was three separate red/green/blue sliders before 0.21.1; if you had customised those, set the colour again here.
etech-void-filtered=Adds a second, greenish void chest that only destroys the items YOU pick: open it and set an infinity filter to "exactly 0" for each item to void - everything else just sits. Same tech unlock as the normal void chest. Needs the void toggle above. On by default.
etech-void-slots=Number of inventory slots in the void chest (1 - 10).
etech-fps-thrusters=Removes the animated exhaust plumes from space platform thrusters - the biggest FPS drain on large platforms. Port of the abandoned FPS Friendly Thrusters mod; automatically skipped if the original mod is installed. On by default.
etech-fusion-passthrough=Gives the fusion generator input-output plasma connections on all four sides so generators can be chained without separate plasma lines. Port of the abandoned Pass-through fusion generator mod; automatically skipped if the original mod is installed. On by default.
etech-colorful-biochamber=Recolors the biochamber's pools, dome and windows per recipe (RGB working visualisations), so you can tell what a biochamber is making at a glance. Port of the abandoned Colorful Biochamber mod (public domain); automatically skipped if the original mod is installed. Needs Space Age; on by default.
etech-copy-paste-modules=Shift-click paste copies modules too: taken straight from your inventory (old modules handed back), with a bot request for anything missing. Handles ghosts and remote view; furnaces, labs and beacons become cross-pastable. Port of the abandoned Copy Paste Modules mod by kajacx; automatically skipped if the original mod is installed. On by default.
etech-total-productivity=Allows productivity modules on recipes the game normally forbids: belts, inserters, rails, pipes, solar panels, walls, ammo, equipment, and more. Four group toggles below pick the categories. Only single-output recipes are affected (multi-output recipes keep their vanilla rules). Port of the abandoned Total Productivity mod by AivanF; automatically skipped if the original mod is installed. Off by default.
etech-prod-logistics=Belts, inserters, containers, robots, rails, trains, vehicles, pipes, poles, combinators, and floor tiles.
etech-prod-buildings=Miners, assemblers, furnaces, labs, roboports, power (solar, accumulators, reactors, generators), radar, walls and gates, and Space Age platform parts.
etech-prod-military=Turrets, guns, ammo, capsules, land mines, armor, and equipment.
etech-prod-misc=Modules, beacons, repair packs, and launchable satellites/probes.
etech-jetpack-ui=Needs the Jetpack mod. While flying, shows a small movable window with the current fuel, inventory count, burn bar, and estimated remaining flight time. Port of Puppy's Jetpack UI with the window-position reset bug fixed; automatically skipped if the original mod is installed. On by default.
etech-map-settings=Toolbar shortcut that opens an editor for map settings (pollution, evolution, enemy expansion, peaceful/no-enemies mode, spoilage rate) and per-surface map generation settings (admins only to apply). Port of the abandoned Edit Map Settings mod; automatically skipped if the original mod is installed. On by default.
etech-resource-markers=Automatically tags resource patches on the map: one marker per patch with the resource icon and total amount (oil and other infinite resources show well count and average yield). Markers update as the map gets charted and ore gets mined. Delete a marker to hide that patch's marker for good; /etech-markers-rebuild rescans everything. Written for E-Tech (public domain), inspired by the abandoned Resource Map Label Marker mod. On by default.
etech-factory-hub=Adds the factory outlet (pulls items out of provider chests INSIDE Factorissimo factory buildings for the local logistic network), the factory inlet (distributes its contents into requester chests inside the factories) and the factory sensor (interior stock as circuit signals). Bots can't fly into factories, so these teleport the items across. Unlocked alongside logistic robotics and Factorissimo's chest connections. Needs Factorissimo 3; on by default.
etech-factory-terminal=Adds a toolbar shortcut that lists every factory outlet, inlet, fluid device and sensor on the surface you're standing on — with its position and what it moved in the last minute — and opens any of them from where you stand (you're dropped into remote view at the device, and put back in your body when you close it). Gated twice: the Factory terminal technology, and a Factory link armor module that must be in your armor with charge in it. The link holds 2 MJ off your suit's own generators; opening costs 100 kJ, keeping it open costs 20 kW, and a flat link closes the window. Needs the factory outlet feature above; on by default.
etech-factory-roboport=Makes the small roboport inside Factorissimo factory buildings work like a real one: logistics coverage over the whole floor, slots for logistic bots and repair packs, plenty of charging pads, and - via the "charge bots from your power grid" setting below - an energy source that can actually charge them. Stock, that roboport covers almost nothing and runs on a void energy source that cannot recharge a robot at all, so once you extend its coverage over a whole floor you get a network full of robots that slowly run flat. Absorbs the factorissimo-roboport-buff mod by RandomBruh (public domain) and fixes the charging problem it didn't address; if that mod is still installed you can remove it. Needs Factorissimo 3; ON by default, since it replaces a mod you were already running.
etech-factory-roboport-logistics-radius=Logistics radius of the interior roboport, in tiles. 64 covers the whole interior of every stock factory building (Factorissimo's stock value is 2, which covers almost nothing). Only the interior roboport is affected. Note: with the Factory building Mk4 setting on, this is raised to at least 128 regardless of what you set here — a 120×120 floor cannot be covered from the door at 64.
etech-factory-roboport-robot-slots=Slots for logistic robots in the interior roboport. Factorissimo's stock value is 0, so it can't hold bots at all. 7 matches a vanilla roboport.
etech-factory-roboport-material-slots=Slots for repair packs in the interior roboport. Factorissimo's stock value is 1. 7 matches a vanilla roboport.
etech-factory-roboport-pads=Number of robot charging pads on the interior roboport, up from the 4 it inherits from the vanilla roboport. This matters far less than it sounds: a robot flies for over a minute per charge, so even a fleet of 800 only needs a handful of pads busy at once. 16 is already generous. Note that pads do nothing unless "charge bots from your power grid" is on. Higher-quality factories get extra pads on top of this. 0 leaves Factorissimo's pads alone.
etech-factory-roboport-kw=Charging power of each pad, in kilowatts. The interior roboport starts at 500 - the base game's rate, copied before Krastorio 2 raises the real roboport to 1000. Like the pad count, this does nothing unless "charge bots from your power grid" is on, and when it is on, sustained throughput is capped by the grid draw limit rather than by this value. The interior roboport runs on a void energy source, so this power is free and costs you no electricity. 0 leaves the stock rate alone.
etech-factory-roboport-pad-radius=How far from the roboport centre the charging pads sit, in tiles. Purely cosmetic - it decides whether charging bots visibly stack on top of each other. 0.75 matches the pad spacing Factorissimo scales down to for the small 2x2 interior roboport; raise it to spread a high pad count out.
etech-factory-roboport-electric=ON by default, and you almost certainly want it on: this is what makes robots charge inside factories at all. Factorissimo runs the interior roboport on a "void" energy source, which stores no energy - and since charging a robot is paid out of a roboport's stored energy, that roboport can never charge anything. Not slowly. Never. Adding charging pads or raising their power changes nothing, because the charging never starts. This setting gives it a real electric energy source, so it works like any other roboport - and, like any other roboport, the power comes out of your grid (roughly 1-2 MW per busy factory, scaling with how many robots are in the air). Factorissimo wires a factory's interior into the same electric network as the outside, and nested factories chain out through their parent, so this is just your normal base power at any depth - there is no separate factory power budget. Charging uses the same low priority as a vanilla roboport, so if your grid can't keep up, bot charging slows down instead of your machines shutting off. Turn it off only if you want Factorissimo's stock behavior back, and accept that robots will not recharge inside factories. WARNING: a factory with no power pole in range of it has no supply at all, and its robots will silently never charge.
etech-factory-roboport-input-mw=Only used when the setting above is on. Caps how much power the interior roboport can pull from your grid. This, not the pad count or per-pad power, is the real limit on how fast a factory's bots can charge. Size it to your fleet: each flying robot burns roughly 20-90 kW depending on your worker robot speed research, so 500 busy bots need around 45 MW. Set it below what your bots actually consume and they will lose charge faster than they gain it.
etech-factory-mk4=Adds a fourth Factorissimo tier, the Factory building Mk4: a 120×120 interior — four times a Mk3's floor — behind an exterior that is still 16×16, with the Mk3's connection ports unchanged and in the same places, so a Mk4 drops straight into a spot you already built for a Mk3. It is tinted blue and uses a different map colour, because otherwise the two would be impossible to tell apart. Two things to know before you commit to it: the ports did NOT grow with the floor, so 32 of them now serve four times the area and you will want more internal bussing per port; and 120×120 is the largest interior Factorissimo can generate (it only prepares the ground for 64 tiles around an interior's centre), so this is the last tier that fits on this exterior. Unlocked by Factory architecture 4, after Factorissimo's own tier-3 research. Needs Factorissimo 3; on by default. ONE THING TO KNOW BEFORE YOU EVER TURN IT BACK OFF: doing so deletes the Mk4 BUILDINGS, because their prototype no longer exists. The interiors themselves are not deleted - nothing in Factorissimo cleans them up - but the building was the only way in, so everything inside becomes unreachable without console commands, and switching the setting back on does not rebuild the buildings. Nothing is destroyed; it is stranded. Turn it off before you build your first Mk4, or leave it on.\n\nSIDE EFFECT WORTH KNOWING: a 120×120 floor needs more reach than Factorissimo's interior roboport has, and that roboport prototype is shared by every tier — so switching the Mk4 on also raises the interior roboport's logistics and construction radius to 128 inside your Mk1, Mk2 and Mk3 factories. That is more coverage than those floors need, never less, and it cannot reach a neighbouring factory's floor (interiors sit 512 tiles apart).
etech-teleporters=Adds buildable teleporter pads (researched with chemical science). Walk onto a pad to open a map of your other pads and click one to teleport there. Pads are named, renamable, and shown as map tags. For pad-less teleporting straight to another player, see "Teleport-to-player shortcut" below. Port of the Teleporters mod by Klonan, updated for Factorio 2.1; on by default.
etech-teleport-shortcut=Adds a toolbar shortcut that teleports you to another player - no pads, no energy cost. One other player online: click teleports straight to them. Several: a picker window opens. Separate from the Teleporter pads feature (which has its own wireless remote for pad-to-pad jumps). Experimental multiplayer fun, off by default.
etech-teleporter-energy-mj=Energy drained from the DESTINATION pad's buffer per teleport. An unpowered pad can't be teleported to. 0 = teleporting is free (the original Teleporters mod behavior). Pad buffer is 200 MJ.
etech-teleporter-energy-distance-mj=Additional energy cost per 100 tiles of distance between the pads (same surface only). 0 = distance doesn't matter.
etech-teleporter-cross-surface=When on, pads on other surfaces (planets, space platforms) appear in the teleporter list. Turn off to restrict teleporting to the surface you're on.
etech-teleporter-cross-surface-multiplier=The per-teleport energy cost is multiplied by this when teleporting between surfaces. 1 = same as a local jump.
etech-teleporter-remote=Toolbar shortcut that opens the teleporter list from anywhere (after the Teleporter technology is researched). Energy is drained from the destination pad, so it can't take you to an unpowered base. This is the pad-network remote - the separate "Teleport-to-player shortcut" startup toggle jumps to players without pads.
etech-teleporter-remote-multiplier=The per-teleport energy cost is multiplied by this when using the wireless remote (no pad under your feet). Convenience premium; 1 = same as a pad-to-pad jump.
etech-teleporter-return-enabled=After a remote teleport, the teleporter list offers a free Return entry (with a live camera view) that takes you back to where you were standing. One slot, overwritten by the next remote jump.
etech-teleporter-return-grace-min=How long the Return entry stays available after a remote teleport. 0 = no time limit.
etech-teleport-body-enabled=After you die, the teleporter list offers a free Body entry (with a live camera view) that takes you back to where you died — the walk back to your corpse, skipped. One use: it disappears once you take it. Works with the teleport-to-player shortcut too (a Body button in its picker), so either teleport feature alone is enough. On by default.
etech-teleport-body-grace-min=How long the Body entry stays available after you die — the "you just died" window. 0 = no time limit, i.e. the death spot stays offered until you use it or die again. (Vanilla corpses never decay, so this limit, not the corpse, is what ends the offer; if a mod does make corpses expire, the entry goes with the corpse.)
etech-teleporter-players-section=Shows your team's online players at the top of the teleporter list with map previews - click one to teleport to them (free, like the teleport-to-player shortcut).
etech-teleporter-consent=Jumping to a teammate — from the players row in the teleporter list, or from the teleport-to-player shortcut — asks them first. They answer "Yes, once", "Yes, always", "No, once" or "No, always"; the two "always" answers are remembered per person and can be taken back at any time in the gear window (the settings button in either teleport window), where you can also decide what happens to requests from anyone you haven't answered for: ask, always allow, or always refuse. No answer within 30 seconds counts as a refusal. Turn this off to go back to landing on each other unannounced. Single-player is unaffected either way. On by default.
etech-teleporter-alerts=Raises a map alert while a teleporter pad's energy buffer sits empty (only when teleporting costs energy). An unpowered pad can't be teleported to.
etech-markers-min-size=Patches with fewer resource tiles than this don't get a map marker. 1 = mark everything. Patches hidden by this limit are counted in the /etech-markers-rebuild summary.
etech-cpm-enabled=Per-player switch for the copy-modules-on-paste behavior. Only matters when the startup toggle is on.
etech-teleporter-sound-volume=Volume of the teleport sound you hear. 0 = silent, 1 = default, 2 = double.
etech-teleporter-preview-size=Size of the minimap preview per pad in your destination list. Smaller = more pads on screen.
etech-teleporter-hide-platforms=When on, pads on space platforms don't appear under "All surfaces" in your list (reduces noise with many ships). Selecting a platform in the surface dropdown still shows its pads.
