[tips-and-tricks-item-name]
etech-factory-mk4=Factory building Mk4

[tips-and-tricks-item-description]
etech-factory-mk4=The [entity=factory-4] Factory building Mk4 takes up exactly as much room outside as a [entity=factory-3] Mk3 and has the same ports in the same places, but its floor is 120×120 — four times the space.\n - Because the outside is the same size and shape as a Mk3, the Mk4 is painted steel blue, reads “04” on the facade, and shows a different colour on the map. Check the colour before you walk in. Its interior walls are teal rather than yellow.\n - The ports did not grow with the floor: 32 of them now feed four times the area — 450 floor tiles per connection, against 112 in a Mk3. Plan more internal bussing per port.\n - Recursion rules go by tier, so a Mk4 can hold a Mk3 (and everything below it) once you have researched factory recursion.\n - 120×120 is the largest interior Factorissimo can generate, so this is the last tier on this exterior size.
