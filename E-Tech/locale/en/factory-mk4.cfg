[entity-description]
# The first four lines are Factorissimo's own factory-1/2/3 description, kept
# verbatim (control placeholders included) so a Mk4 teaches the same keys every
# other tier does. The Mk4-specific paragraph follows it.
factory-4=Grants an extra factory floor to more efficiently utilize the land area.\n__CONTROL__factory-rotate__ to toggle port markers (requires ALT-mode).\n__CONTROL__factory-open-outside-surface-to-remote-view__ to open the factory floor in remote view.\n__CONTROL__cut__ to move the factory building from remote view.\n\nSame 16×16 exterior as a Factory building Mk3 — it drops into any spot already built for one, with the same 32 connection ports in the same places — but the interior is 120×120 instead of 60×60: four times the floor space. Painted steel blue with a “04” on the front so you can tell the two apart.
space-factory-4=Grants an extra factory floor to more efficiently utilize the land area.\n__CONTROL__factory-rotate__ to toggle port markers (requires ALT-mode).\n__CONTROL__factory-open-outside-surface-to-remote-view__ to open the factory floor in remote view.\n__CONTROL__cut__ to move the factory building from remote view.\n\nThe space-platform Factory building Mk4: a 120×120 interior behind the same exterior as a Space factory 3, marked with an amber “04”.

