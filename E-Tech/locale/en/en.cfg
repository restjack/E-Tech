[tips-and-tricks-item-name]
etech-overview=E-Tech

[tips-and-tricks-item-description]
etech-overview=E-Tech restores vanilla recipes under AAI Industry and bundles optional quality-of-life features. Since 0.21 nearly everything is on by default — a toggle you never found is a feature you never got, and turning one off is a single switch. Ports of standalone mods disable themselves when you already have the original, and anything needing Space Age, Factorissimo or Jetpack does nothing without them. Four things stay off: total productivity, restoring the nuclear fuel crafting Krastorio 2 hides, the experimental teleport-to-player shortcut, and verbose recipe logging. Open Settings → Mod settings to see the lot: void chest & pipe, teleporter pads, resource map markers, the in-game map settings editor, the factory outlet/inlet/sensor and a fourth factory tier for Factorissimo, and more. A feature only exists in the game while its toggle is on.
